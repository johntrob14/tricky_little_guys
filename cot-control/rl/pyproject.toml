[project]
name = "rl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cotswitch",
    "datasets>=5.1.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "tinker>=0.34.0",
    "transformers>=5.20.1",
]

[tool.uv.sources]
cotswitch = { path = "../grading", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
