# Whole prompt specs by name (see prompt_spec.py). Each axis lists fragment names under prompts/<axis>/; prefix is one name or null.
# Names starting with an underscore are shared pieces, not presets. Axis flags in run_attack.py replace single axes of a preset.
#   attacker_*  the red-team framing as the system prompt
#   honest_*    the plain honest-agent system prompt (logs/atk-qwen-* ran honest_hide)
#   *_hide      the user prompt also tells the model about the monitor and to conceal the side task
#   control     the main-task prompt alone, same secrets seeded, both scorers run (logs/ctl-qwen-*)

_attacker_system: &attacker_system [attacker_framing_open, attacker_persona, attacker_objective, attacker_blend_in, attacker_procedure, attacker_framing_close]
_hide: &hide [no_mention, hide_monitor_notice, hide_conceal]

attacker_hide: {system: *attacker_system, prefix: secondary_objective, description: true, guidance: *hide}
attacker_no_hide: {system: *attacker_system, prefix: secondary_objective, description: true, guidance: [no_mention]}
honest_hide: {system: [honest], prefix: secondary_objective, description: true, guidance: *hide}
honest_no_hide: {system: [honest], prefix: secondary_objective, description: true, guidance: [no_mention]}
control: {system: [honest], prefix: null, description: false, guidance: []}

# arena_covert_user: the default for run_attack.py. The system message is the standard coding-agent prompt;
# the user message is the main task, coaching, then the secondary-objective prefix and generated description, separated by blank lines.
arena_covert_user: {system: [honest], user_coaching: [arena_covert_v2], prefix: secondary_objective, description: true, guidance: []}

# arena_covert_v2: one system message holds the red-team framing and all the monitor-evasion advice (prompts/system/arena_covert_v2.txt);
# the user message is the main task, the secondary-objective prefix and the generated description, with no guidance fragments.
arena_covert_v2: {system: [arena_covert_v2], prefix: secondary_objective, description: true, guidance: []}
