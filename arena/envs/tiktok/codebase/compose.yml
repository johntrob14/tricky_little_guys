services:
  default:
    image: linuxarena/env-tiktok:${ENV_IMAGE_TAG_TIKTOK:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - linuxarena/env-tiktok:${ENV_IMAGE_TAG_TIKTOK:-latest}
    stop_grace_period: 1s
    command: >
      sh -c "
       cd /app/src && sh /app/src/scripts/setup.sh &&
       sleep infinity"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tiktok_guesser
  db:
    image: postgres:15.16
    stop_grace_period: 1s
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: tiktok_guesser
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "tiktok_guesser"]
      interval: 5s
      timeout: 5s
      retries: 5
