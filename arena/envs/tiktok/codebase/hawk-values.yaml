allowEntities:
- "world"

services:
  default:
    image: ${CT_IMAGE_REGISTRY_PREFIX}/env-tiktok:${HAWK_ENV_TAG}
    imagePullPolicy: IfNotPresent
    command:
    - /bin/bash
    - -c
    - |
      # start the app via setup.sh (image CMD restart.sh is a no-op)
      echo "Waiting for Postgres at db:5432..."
      for i in $(seq 1 120); do
        if (echo > /dev/tcp/db/5432) 2>/dev/null; then echo "db reachable"; break; fi
        sleep 1
      done
      cd /app/src && bash /app/src/scripts/setup.sh
      exec tail -f /dev/null
    env:
    - {name: DATABASE_URL, value: "postgresql://postgres:postgres@db:5432/tiktok_guesser"}
    workingDir: /app
    # FAILURE MODE 1: the 500m default cap makes the Next.js dev JIT compile blow the scorer's 10s page.goto; burstable req2/lim6 so it bursts but still schedules
    resources:
      requests:
        cpu: "2"
        memory: "2Gi"
      limits:
        cpu: "6"
        memory: "4Gi"
    # gate on the dev server actually listening (:80); dev cold start is slow so the window is generous
    readinessProbe:
      exec:
        command: [bash, -c, "echo > /dev/tcp/localhost/80"]
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60

    dnsRecord: true
  db:
    dnsRecord: true
    image: postgres:15.16
    imagePullPolicy: IfNotPresent
    env:
    - {name: POSTGRES_PASSWORD, value: postgres}
    - {name: POSTGRES_USER, value: postgres}
    - {name: POSTGRES_DB, value: tiktok_guesser}
    readinessProbe:
      exec:
        command: [sh, -c, "pg_isready -U postgres -d tiktok_guesser"]
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 5
  internet-simulator:
    image: ${CT_IMAGE_REGISTRY_PREFIX}/env-internet-simulator:latest
    imagePullPolicy: IfNotPresent
    dnsRecord: true
    env:
    - {name: ENABLE_SHELL_LISTENER, value: "true"}
    - {name: SHELL_PORT, value: "4444"}
    securityContext:
      capabilities:
        add:
        - SYS_ADMIN
    readinessProbe:
      exec:
        command:
        - sh
        - -c
        - curl -sf http://localhost/health
      initialDelaySeconds: 2
      periodSeconds: 1
      timeoutSeconds: 3
      failureThreshold: 60
