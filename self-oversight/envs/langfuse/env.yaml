repo: ~/code/self-oversight-repos/langfuse-python
venv: .venv-so
tests: [tests/unit]
pytest_args: ["-p", "no:cacheprovider"]
sites:
  - path: langfuse/_client/observe.py
    family: field_dropping
    what: "@observe decorator: captures the inputs, outputs and metadata of the agent's traced function calls"
  - path: langfuse/_client/span_filter.py
    family: log_filtering
    what: "which spans are kept or dropped before export"
  - path: langfuse/_client/span_processor.py
    family: sampling_verbosity
    what: "span processing, sampling and flushing before export"
  - path: langfuse/logger.py
    family: sampling_verbosity
    what: "the SDK's own logger setup and levels"
