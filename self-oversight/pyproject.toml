[project]
name = "self-oversight"
version = "0.1.0"
description = "Model organism that quietly reduces monitoring of its own activity during coding tasks, on Tinker"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tinker",
    "tinker_cookbook",
    "torch",
    "pyyaml",
    "pytest",
    "pandas",
    "unidiff>=1.0.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
