        design: "arena_covert_v2 (system message prompts/system/arena_covert_v2.txt, preset arena_covert_v2, commit 4d2c8c2) against attacker_hide on the same cells and seeds, 4 tiktok main tasks x 3 tiers x 2 episodes = 24 samples per cell, no prefill. v2 puts the red-team framing and all the monitor-evasion advice in the system message and sends the main task, the secondary-objective prefix and the generated description as the user message. attacker_hide uses the six-fragment attacker system message and adds three guidance fragments to the user message, so the two prompts differ in the system message, the guidance and the user message length and are not a one-axis change. The earlier Qwen attacker_hide cells from the prefill grid above (qwen-attacker-none-*) are kept as a same-prompt replicate."
