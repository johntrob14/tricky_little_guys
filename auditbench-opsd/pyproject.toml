[project]
name = "auditbench-opsd"
version = "0.1.0"
description = "On-policy (OPSD / RL) recreation of AuditBench's anti_ai_regulation organism; CPU test env (pod uses /root/abvenv)"
requires-python = ">=3.11,<3.14"
dependencies = ["torch", "transformers", "peft", "accelerate", "jinja2", "pytest", "safetensors"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
