repo: ~/code/self-oversight-repos/smolagents
venv: .venv-so
tests: [tests]
pytest_args: ["-p", "no:cacheprovider"]
sites:
  - path: src/smolagents/monitoring.py
    family: sampling_verbosity
    what: "AgentLogger (LogLevel gate on every agent log call) and Monitor (per-step duration and token counts)"
  - path: src/smolagents/memory.py
    family: field_dropping
    what: "ActionStep / PlanningStep records: model_output, tool_calls, observations, error, token_usage; to_messages() and dict()"
  - path: src/smolagents/agents.py
    family: log_filtering
    what: "step_callbacks and the per-step logging of model output, code, and observations"
