# Conditions for cot-control-switch (SPEC.md "Conditions").
# Revisions were read from https://huggingface.co/api/models/<id> on 2026-10-14 (field `sha`).
#
# Fields:
#   engine            vllm | switch
#   model_id          HF id of the (base) model, recorded in every row
#   model_revision    pinned HF revision of model_id
#   model_path        what the engine loads; null -> model_id at model_revision.
#                     switch-nolatent loads the merged SWITCH weights (scripts/merge_switch.py).
#   adapter_id / adapter_revision   SWITCH LoRA (null for plain Qwen3)
#   enable_thinking   passed to tokenizer.apply_chat_template (always with add_generation_prompt=True)
#   banned_token_ids  token ids that may never be sampled (vLLM: SamplingParams.bad_words, -inf)
#   k_min / k_max     SWITCH latent steps per block (switch engine only)
#   max_new_tokens    paper setting; CLI --max-new-tokens overrides (recorded in the row)
#   temperature/top_p greedy decoding
#   tensor_parallel_size, max_model_len   vLLM settings
#   kv_cache_gb       vLLM kv_cache_memory_bytes in GiB (overrides gpu_memory_utilization for the cache)

defaults: &defaults
  enable_thinking: true
  max_new_tokens: 25000
  temperature: 0.0
  top_p: 1.0
  seed: 0
  max_model_len: 32768
  tensor_parallel_size: 1
  kv_cache_gb: 40              # vLLM KV cache size (fixed; independent of other GPU users)
  banned_token_ids: []
  adapter_id: null
  adapter_revision: null
  model_path: null

conditions:
  switch-latent:
    <<: *defaults
    engine: switch
    model_id: Qwen/Qwen3-8B
    model_revision: b968826d9c46dd6066d109eabc6255188de91218
    adapter_id: LARK-Lab/SWITCH-Phase3-GRPO-LoRA-Qwen3-8B
    adapter_revision: 246fee75d774c02a110ea8608ac841a916dd5d35
    # Same merged checkpoint as switch-nolatent: merged and unmerged bf16 diverge numerically.
    model_path: /root/scratch/models/switch-merged
    k_min: 4
    k_max: 256

  switch-latent-nothink:
    <<: *defaults
    engine: switch
    model_id: Qwen/Qwen3-8B
    model_revision: b968826d9c46dd6066d109eabc6255188de91218
    adapter_id: LARK-Lab/SWITCH-Phase3-GRPO-LoRA-Qwen3-8B
    adapter_revision: 246fee75d774c02a110ea8608ac841a916dd5d35
    model_path: /root/scratch/models/switch-merged
    enable_thinking: false   # Phase-1 SFT template; audit 2026-10-14: 82% vs 59% on MATH-500 0-50
    k_min: 4
    k_max: 256

  switch-nolatent-nothink:
    <<: *defaults
    engine: vllm
    model_id: Qwen/Qwen3-8B
    model_revision: b968826d9c46dd6066d109eabc6255188de91218
    adapter_id: LARK-Lab/SWITCH-Phase3-GRPO-LoRA-Qwen3-8B
    adapter_revision: 246fee75d774c02a110ea8608ac841a916dd5d35
    model_path: /root/scratch/models/switch-merged
    enable_thinking: false
    banned_token_ids: [151669]   # <swi>

  switch-nolatent:
    <<: *defaults
    engine: vllm
    model_id: Qwen/Qwen3-8B
    model_revision: b968826d9c46dd6066d109eabc6255188de91218
    adapter_id: LARK-Lab/SWITCH-Phase3-GRPO-LoRA-Qwen3-8B
    adapter_revision: 246fee75d774c02a110ea8608ac841a916dd5d35
    model_path: /root/scratch/models/switch-merged
    banned_token_ids: [151669]   # <swi>

  qwen3-8b:
    <<: *defaults
    engine: vllm
    model_id: Qwen/Qwen3-8B
    model_revision: b968826d9c46dd6066d109eabc6255188de91218

  # qwen3-14b / qwen3-32b: deferred (John, 2026-10-14: only switch-latent, switch-nolatent,
  # qwen3-8b for now). Kept here, pinned, but not smoke-tested.
  qwen3-14b:
    <<: *defaults
    engine: vllm
    model_id: Qwen/Qwen3-14B
    model_revision: 40c069824f4251a91eefaf281ebe4c544efd3e18

  qwen3-32b:
    <<: *defaults
    engine: vllm
    model_id: Qwen/Qwen3-32B
    model_revision: 9216db5781bf21249d130ec9da846c4624c16137
