[project]
name = "rl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cotswitch",
    "datasets>=5.1.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "tinker>=0.34.0",
    "tml-renderers>=0.2.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[tool.uv.sources]
cotswitch = { path = "../grading", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
