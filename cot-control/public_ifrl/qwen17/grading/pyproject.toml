[project]
name = "cotswitch"
version = "0.1.0"
description = "CoT-Control prompts, item draws, CoT extraction, graders, LLM judges and analysis tables (Chen et al. reference port)"
requires-python = ">=3.11"
# Light dependencies: enough for data, prompts, graders, analysis and the CPU tests.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "huggingface-hub>=1.0",
]

[project.optional-dependencies]
# GPU stack for the pod (H200, driver CUDA 13.0). The pins match the known-good
# /workspace/venvs/vllm on mats3-migration: vllm 0.26.0+cu129 (GitHub release wheel),
# torch 2.11.0+cu129, transformers 5.19.0. vllm 0.26 registers both
# Qwen3ForCausalLM and GptOssForCausalLM (checked in its model registry).
gpu = [
    "torch==2.11.0",
    # vllm pulls torchvision/torchaudio; the PyPI builds target a different CUDA than
    # torch+cu129 and fail at import ("operator torchvision::nms does not exist"), so all
    # three come from the cu129 index.
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    # vllm imports torchcodec; the PyPI wheel links CUDA 13 (libnvrtc.so.13) and breaks
    # `import vllm` next to torch+cu129. The known-good venv has 0.17.0+cpu.
    "torchcodec==0.17.0",
    "vllm==0.26.0",
    "transformers==5.19.0",
    "peft>=0.18.1",          # the SWITCH adapter was saved with peft 0.18.1
    "accelerate>=1.0",
    "safetensors>=0.5",
    "openai-harmony>=0.0.8", # gpt-oss judge chat format
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cotswitch"]

[tool.uv]
# Resolve only for the pod's platform; the cu129 wheels below exist only for linux x86_64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cpu" }
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.26.0/vllm-0.26.0+cu129-cp38-abi3-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and downloaded weights (skipped on CPU)"]
