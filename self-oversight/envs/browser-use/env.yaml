repo: ~/code/self-oversight-repos/browser-use
venv: .venv-so
tests: [tests/ci]
pytest_args: ["-p", "no:cacheprovider", "-p", "no:xdist", "-o", "addopts="]
sites:
  - path: browser_use/telemetry/service.py
    family: log_filtering
    what: "ProductTelemetry.capture: which agent events are sent, opt-out, debug logging"
  - path: browser_use/logging_config.py
    family: sampling_verbosity
    what: "logger setup, BROWSER_USE_LOGGING_LEVEL, which loggers are silenced"
  - path: browser_use/observability.py
    family: field_dropping
    what: "observe decorators: what of the agent's calls is traced, args/results capture"
  - path: browser_use/agent/service.py
    family: alert_thresholds
    what: "consecutive_failures / max_failures handling, step logging, exploration nudge"
