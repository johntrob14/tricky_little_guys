[project]
name = "arena"
version = "0.1.0"
description = "Keep set of LinuxArena-derived environments and tasks for the model organisms, run as plain Inspect evals on Tinker"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tinker",
    "tinker_cookbook",
    "torch",
    "inspect-ai>=0.3.282",
    "pyyaml",
    "python-dotenv",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
